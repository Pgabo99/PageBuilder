name: pagebuilder

# A backend és a worker közös beállításai (image, hitelesítő adatok, kód).
x-backend: &backend
  build:
    context: ./backend
    dockerfile: ../docker/php/Dockerfile
    target: base
  image: pagebuilder-backend:dev
  # Egyetlen forrás a gyökér .env; a konténer-környezet elsőbbséget élvez a backend/.env-vel szemben.
  environment:
    APP_URL: http://localhost:${NGINX_PORT:-8080}
    PUBLISH_PATH: /var/www/sites
    DB_DATABASE: ${MYSQL_DATABASE:?másold a .env.example-t .env néven}
    DB_USERNAME: ${MYSQL_USER:?másold a .env.example-t .env néven}
    DB_PASSWORD: ${MYSQL_PASSWORD:?másold a .env.example-t .env néven}
    DB_TEST_DATABASE: ${MYSQL_DATABASE:?másold a .env.example-t .env néven}_testing
    DB_TEST_USERNAME: ${MYSQL_TEST_USER:?másold a .env.example-t .env néven}
    DB_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?másold a .env.example-t .env néven}
    # Alapérték 5; csak az elkülönített E2E-projekt emeli (e2e/e2e.env).
    AUTH_THROTTLE_PER_MINUTE: ${AUTH_THROTTLE_PER_MINUTE:-5}
  volumes:
    - ./backend:/var/www/backend

services:
  mysql:
    image: mysql:9.7.4@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?másold a .env.example-t .env néven}
      MYSQL_USER: ${MYSQL_USER:?másold a .env.example-t .env néven}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?másold a .env.example-t .env néven}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?másold a .env.example-t .env néven}
      MYSQL_TEST_USER: ${MYSQL_TEST_USER:?másold a .env.example-t .env néven}
      MYSQL_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?másold a .env.example-t .env néven}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # A $$ miatt a konténer shellje helyettesít: a jelszó nem kerül a parancssorba és a healthcheck-naplóba.
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -N -s -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.10.3-alpine3.23@sha256:7958cfbb9d152f87dadfbc89f1b0b15938f0b81ff8982feb327476f4911935c3
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    <<: *backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *backend
    volumes:
      - ./backend:/var/www/backend
      # A publikált webhelyek kötetét kizárólag a worker írja és törli; az Nginx csak olvassa.
      - sites-data:/var/www/sites
    # A --timeout kisebb a Redis queue retry_after értékénél (90 s), így egy job nem fut kétszer párhuzamosan.
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=60"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/node/Dockerfile
      target: base
    image: pagebuilder-frontend:dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      HMR_CLIENT_PORT: ${HMR_CLIENT_PORT:-${NGINX_PORT:-8080}}
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Linuxra telepített függőségek, elkülönítve a host node_modules-tól.
      - frontend-node-modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx:
    image: nginx:1.30.7-alpine3.24@sha256:bef154735288bc38d99fac41ae63730684bcc661503673a04a0f9bc526ba8598
    ports:
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Csak a public könyvtár: a .env és a többi backend-fájl nincs az Nginx konténerben.
      - ./backend/public:/var/www/backend/public:ro
      - sites-data:/var/www/sites:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # E2E (profil: e2e): az nginx hálózati névterében fut, így a böngésző localhost-on éri el az alkalmazást
  # (a Sanctum alapból stateful hoszt). Indítás: scripts/e2e.sh.
  e2e:
    profiles: [e2e]
    image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:9beb546099e11f52d62e505537914870e01a67e0e6b00ae41da4775324e73dbe
    network_mode: "service:nginx"
    init: true
    ipc: host
    working_dir: /e2e
    command: ["sh", "-c", "npm ci --no-fund --no-audit && npx playwright test"]
    volumes:
      - ./e2e:/e2e
      - e2e-node-modules:/e2e/node_modules
    depends_on:
      nginx:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
  frontend-node-modules:
  sites-data:
  e2e-node-modules:

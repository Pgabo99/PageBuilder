name: GitOps

# Csak kézzel indítható; nem kötelező ellenőrzés. Eldobható kind-klaszterben telepíti az Argo CD-t, és
# szinkronizálja a main ág deploy/app könyvtárát (távoli ágat nem hoz létre és nem módosít).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kind-argocd:
    name: kind-argocd
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: kind és Argo CD, első szinkron
        run: bash scripts/gitops-check.sh

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # A tag-bump merge-e (csak deploy/) nem indít újabb image-buildet; a PR-ellenőrzések nem szűrtek.
    paths-ignore: ['deploy/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A main-en a publikálás nem szakadhat meg félúton.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A .env.example placeholder jelszavai csak az eldobható CI-adatbázisra érvényesek.
      - name: Környezet
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env

      - name: MySQL és Redis
        run: docker compose up -d --wait mysql redis

      - name: Függőségek (composer.lock)
        run: docker compose run --rm --no-deps backend composer install --no-interaction --no-progress

      - name: APP_KEY
        run: docker compose run --rm --no-deps backend php artisan key:generate

      - name: Pint
        run: docker compose run --rm --no-deps backend composer lint

      - name: Pest
        run: docker compose run --rm backend composer test

  # Minden súlyosság megjelenik, de csak a HIGH és a CRITICAL blokkol; automatikus javítás nincs.
  security:
    name: security
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Környezet
        run: cp .env.example .env

      - name: Trivy fs (függőségek, titkok)
        run: |
          trivy() { docker run --rm -v "$PWD:/src" -v trivy-cache:/root/.cache "$TRIVY" fs --scanners vuln,secret --skip-dirs backend/vendor,frontend/node_modules "$@" /src; }
          trivy --exit-code 0
          trivy --severity HIGH,CRITICAL --exit-code 1

      # A Kubernetes-manifesztek hibás beállításai; az infra/ elfogadott kivételei (docs/devops.md) miatt csak a deploy/.
      - name: Trivy config (deploy)
        run: docker run --rm -v "$PWD/deploy:/src:ro" "$TRIVY" config --severity HIGH,CRITICAL --exit-code 1 /src

      - name: composer audit
        run: |
          docker compose run --rm --no-deps backend composer audit --locked || true
          docker compose run --rm --no-deps backend composer audit --locked --ignore-severity=low --ignore-severity=medium

      - name: npm audit
        run: docker compose run --rm --no-deps frontend npm audit --audit-level=high

  # Production image-ek: teljes riport, majd csak a javítható HIGH/CRITICAL blokkol (--ignore-unfixed, AI-045).
  images:
    name: images
    runs-on: ubuntu-latest
    env:
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: |
          docker build --target prod -t pagebuilder-backend:prod -f docker/php/Dockerfile backend
          docker build -t pagebuilder-nginx:prod -f docker/nginx/Dockerfile .

      - name: Trivy image
        run: |
          trivy() { docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$TRIVY" image --scanners vuln,secret "$@"; }
          for img in pagebuilder-backend:prod pagebuilder-nginx:prod; do
            trivy --exit-code 0 "$img"
            trivy --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Környezet
        run: cp .env.example .env

      - name: Függőségek és ellenőrzések (package-lock.json)
        run: >-
          docker compose run --rm --no-deps frontend sh -c
          "npm ci --no-fund --no-audit
          && npm run check:lint
          && npm run format:check
          && npm run type-check
          && npm run test:unit -- --run"

  # A README első indítási lépései tiszta checkouton, majd a smoke teszt (scripts/smoke.sh).
  install:
    name: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Környezet
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env

      - name: Build és függőségek
        run: |
          docker compose build
          docker compose run --rm --no-deps backend composer install --no-interaction --no-progress
          docker compose run --rm --no-deps frontend npm ci --no-fund --no-audit
          docker compose run --rm --no-deps backend php artisan key:generate
          # Linuxon a bind mountolt storage a hosté, a PHP-FPM (www-data) nem írhatna bele.
          docker compose run --rm --no-deps backend chmod -R a+rwX storage bootstrap/cache

      - name: Indítás és migráció
        run: |
          docker compose up -d --wait
          docker compose exec -T backend php artisan migrate --force

      - name: Smoke teszt
        run: bash scripts/smoke.sh

      # A Laravel naplója fájlba ír, ezért a konténerből olvassuk ki.
      - name: Diagnosztika hiba esetén
        if: failure()
        run: |
          docker compose logs --tail 50
          docker compose exec -T backend sh -c 'ls -lan storage storage/framework storage/logs; tail -n 20 storage/logs/laravel.log' || true

  # Playwright E2E elkülönített Compose-projektben (scripts/e2e.sh); a takarítás a szkript dolga.
  # A riport és a trace csak hibánál töltődik fel; a tesztadatok futásidőben generáltak, valódi adat nincs bennük.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Playwright E2E
        run: bash scripts/e2e.sh

      - name: Playwright-riport hiba esetén
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Secret-ellenőrzés a nyomon követett fájlokra és a teljes Git-előzményre; az értékek nem jelennek meg a naplóban.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Szkripttesztek (mesterséges értékek)
        run: bash scripts/test-check-secrets.sh

      - name: Ellenőrzés
        run: bash scripts/check-secrets.sh

  # A deploy-szkriptek tesztje (a manifestek másolatán fut).
  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set-image-tag.sh
        run: bash scripts/test-set-image-tag.sh

  # Csak a main-en, minden ellenőrzés után; latest tag nincs, a deploy a commit SHA-ra épül.
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Azure-hitelesítés és erőforrás nélkül: formátum, érvényesség, offline (mock provider) tesztek.
      - name: fmt, validate, test
        env:
          TERRAFORM_IMAGE: hashicorp/terraform:1.17.1@sha256:a5d5a5a892c98f60fcbfa81eac2a40fc19e7b3fa7719bccae10ff6111d22524a
        run: |
          tf() { docker run --rm -v "$PWD/infra:/work" -w /work "$TERRAFORM_IMAGE" "$@"; }
          tf fmt -check -recursive
          tf init -backend=false -input=false
          tf validate
          tf test

  publish:
    name: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, security, images, install, scripts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image-nevek
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND_IMAGE=ghcr.io/$owner/pagebuilder-backend:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "NGINX_IMAGE=ghcr.io/$owner/pagebuilder-nginx:$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Build
        run: |
          label="org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          docker build --target prod --label "$label" -t "$BACKEND_IMAGE" -f docker/php/Dockerfile backend
          docker build --label "$label" -t "$NGINX_IMAGE" -f docker/nginx/Dockerfile .

      # Mindkét image-nek át kell mennie, mielőtt bármelyik publikálódik.
      - name: Trivy image
        run: |
          for img in "$BACKEND_IMAGE" "$NGINX_IMAGE"; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v trivy-cache:/root/.cache "$TRIVY" \
              image --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$img"
          done

      - name: Push a GHCR-be
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$BACKEND_IMAGE"
          docker push "$NGINX_IMAGE"
          echo "BACKEND_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$BACKEND_IMAGE")" >> "$GITHUB_ENV"
          echo "NGINX_DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$NGINX_IMAGE")" >> "$GITHUB_ENV"

      - name: Letöltés digest alapján és füstteszt
        run: |
          docker rmi "$BACKEND_IMAGE" "$NGINX_IMAGE"
          docker pull "$BACKEND_DIGEST"
          docker pull "$NGINX_DIGEST"
          docker network create smoke
          # Adatbázis nélkül: az /up és a SPA nem igényel DB-t.
          docker run -d --name smoke-backend --network smoke --network-alias backend \
            -e APP_ENV=production -e APP_KEY="base64:$(head -c 32 /dev/urandom | base64)" \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e LOG_CHANNEL=stderr "$BACKEND_DIGEST"
          docker run -d --name smoke-nginx --network smoke -p 127.0.0.1:8080:8080 "$NGINX_DIGEST"
          for path in / /up; do
            curl -fsS --retry 10 --retry-delay 2 --retry-all-errors -o /dev/null "http://127.0.0.1:8080$path"
            echo "$path OK"
          done

      - name: Összefoglaló
        if: always()
        run: |
          {
            echo "### Publikált image-ek"
            echo "| Image | Tag | Digest |"
            echo "|---|---|---|"
            echo "| backend | \`$BACKEND_IMAGE\` | \`${BACKEND_DIGEST#*@}\` |"
            echo "| nginx | \`$NGINX_IMAGE\` | \`${NGINX_DIGEST#*@}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Kijelentkezés
        if: always()
        run: docker logout ghcr.io

  # A publikált image-ek tagjét PR-ban írja át a deploy/app-ban. A magasabb jogok csak itt vannak.
  # A PR nem kerüli meg a branch protectiont: a bot-PR pull_request futása kézi jóváhagyásra vár
  # (Approve and run workflows), a merge is kézi.
  bump:
    name: bump
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Csak létező image-re nyílhat PR.
      - name: Image-ek elérhetősége a GHCR-ben
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for name in pagebuilder-backend pagebuilder-nginx; do
            docker manifest inspect "ghcr.io/$owner/$name:$GITHUB_SHA" >/dev/null
            echo "$name:$GITHUB_SHA elérhető"
          done

      - name: Tag-csere
        run: bash scripts/set-image-tag.sh "$GITHUB_SHA"

      - name: Branch és PR
        run: |
          if git diff --quiet; then
            echo "A manifestek már erre a SHA-ra mutatnak, nincs teendő."
            exit 0
          fi
          branch="deploy/image-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Image-tag frissítése: ${GITHUB_SHA::7}"
          git push origin "$branch"
          body="A deploy/app image-címkéi a(z) $GITHUB_SHA commit image-eire mutatnak.

          Automatikus PR: az ellenőrzések a pull_request futás kézi jóváhagyása után indulnak. Rollback: a merge-commit git revert-je (PR-ban)."
          gh pr create --base main --head "$branch" --assignee "$GITHUB_REPOSITORY_OWNER" \
            --title "Image-tag frissítése: ${GITHUB_SHA::7}" --body "$body"

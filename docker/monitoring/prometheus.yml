# A szintetikus próbák 5 s-onként futnak; a rules.yml ablaklefedettség-számítása erre az értékre épül.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox:9115"]

  # Szintetikus réteg: a blackbox exporter próbái, forgalomtól függetlenek (layer="synthetic").
  - job_name: synthetic
    scrape_interval: 5s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx/up"]
        labels: { layer: synthetic, probe: api_health }
      - targets: ["http://nginx/"]
        labels: { layer: synthetic, probe: spa }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

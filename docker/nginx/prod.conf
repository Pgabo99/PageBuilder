# Production: a buildelt SPA és a Laravel (a hivatalos Nginx-konfig alapján) közös originen, nem root felhasználóval (8080).
server {
    listen 8080;
    server_name _;
    root /var/www/frontend;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    server_tokens off;

    location = /nginx-health {
        access_log off;
        return 200;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # A felhasználók által szerkesztett, publikált oldalak: szigorú fejlécekkel (script egyáltalán nem fut),
    # a rejtett (pl. ideiglenes) könyvtárakat a fenti rejtettfájl-szabály tiltja. Az add_header-ek a szerver
    # szintű fejléceket felülírják, ezért itt újra szerepelnek.
    location /sites/ {
        alias /var/www/sites/;
        try_files $uri $uri/index.html =404;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~ ^/(api|sanctum|up)(/|$) {
        root /var/www/backend/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/backend/public;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

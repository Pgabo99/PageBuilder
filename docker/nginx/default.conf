# Fejlesztői konfiguráció: Laravel (a hivatalos Nginx-konfig alapján) és a Vite dev szerver közös originen.
# A production konfiguráció a SPA buildjét szolgálja ki (T2.3).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Valódi forgalom a monitoringhoz: időzített napló egy megosztott kötetre (a monitoring profil exportere olvassa).
# A formátum azonos a docker/monitoring/nginxlog.yml `format` értékével (a monitoring-check.sh ellenőrzi).
log_format timed '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time';

# A blackbox próbák (szintetikus réteg) nem kerülnek a naplóba: az csak valódi kéréseket tartalmaz.
# A próbák User-Agentje a docker/monitoring/blackbox.yml-ben van rögzítve.
map $http_user_agent $log_real {
    default 1;
    "~^pagebuilder-blackbox" 0;
}

server {
    listen 80;
    server_name _;
    root /var/www/backend/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    server_tokens off;

    # A server szintű access_log felülírja a http szintűt, ezért a szokásos (stdout) napló itt újra szerepel.
    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx-timed/timed.log timed if=$log_real;

    location = /nginx-health {
        access_log off;
        return 200;
    }

    # Rejtett fájlok (.env, .git) tiltása a Laravel és a Vite felé is; a regex location megelőzi a prefixeket.
    # Kivétel a Vite előcsomagolt függőségei (/node_modules/.vite/), ezek nélkül a SPA nem tölt be.
    location ~ (?<!/node_modules)/\.(?!well-known/) {
        deny all;
    }

    # A felhasználók által szerkesztett, publikált oldalak: szigorú fejlécekkel (script egyáltalán nem fut),
    # a rejtett (pl. ideiglenes) könyvtárakat a fenti rejtettfájl-szabály tiltja. Az add_header-ek a szerver
    # szintű fejléceket felülírják, ezért itt újra szerepelnek.
    location /sites/ {
        alias /var/www/sites/;
        try_files $uri $uri/index.html =404;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ~ ^/(api|sanctum|up)(/|$) {
        try_files $uri /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

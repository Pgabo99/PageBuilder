apiVersion: v1
kind: Namespace
metadata:
  name: pagebuilder
---
# Nem titkos beállítások. A titkok a `pagebuilder-secrets` Secretben vannak (nincs a gitben, lásd docs/devops.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pagebuilder-config
  namespace: pagebuilder
data:
  APP_NAME: PageBuilder
  APP_ENV: production
  APP_DEBUG: "false"
  # A T6.3 (HTTPS) a tényleges DNS-névre és https-re cseréli ezt a három értéket.
  APP_URL: http://localhost
  SANCTUM_STATEFUL_DOMAINS: localhost
  SESSION_SECURE_COOKIE: "false"
  LOG_CHANNEL: stderr
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: pagebuilder
  DB_USERNAME: pagebuilder
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  CACHE_STORE: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  PUBLISH_PATH: /var/www/sites
  # A MySQL image első indításkor ezekből hozza létre az adatbázist és a felhasználót.
  MYSQL_DATABASE: pagebuilder
  MYSQL_USER: pagebuilder
